# ================================================================
# TicketRush — Full Docker Development Environment
# ================================================================
#
#  Chạy toàn bộ hệ thống:
#    docker compose up -d --build
#
#  Xem logs:
#    docker compose logs -f backend
#    docker compose logs -f frontend
#
#  Dừng tất cả:
#    docker compose down
#
#  Reset database (xóa hết data):
#    docker compose down -v
#    docker compose up -d --build
#
# ================================================================
# Ports đã được chọn để KHÔNG xung đột với phần mềm cài sẵn:
#   MySQL:    3307  (tránh xung đột MySQL local 3306)
#   Redis:    6380  (tránh xung đột Redis local 6379)
#   Backend:  8080
#   Frontend: 5173
# ================================================================

services:

  # ========== DATABASE ==========
  mysql:
    image: mysql:8.0
    container_name: ticketrush-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticketrush
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ticketrush-net

  # ========== CACHE / QUEUE ==========
  redis:
    image: redis:7-alpine
    container_name: ticketrush-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketrush-net

  # ========== VECTOR DATABASE (RAG) ==========
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ticketrush-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ticketrush-net

  # ========== EVENT STREAMING / MESSAGE BROKER (Kafka KRaft) ==========
  kafka:
    image: apache/kafka:latest
    container_name: ticketrush-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ticketrush-net

  # ========== BACKEND (Spring Boot) ==========
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketrush-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.0-flash-exp:free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      QDRANT_URL: http://qdrant:6333
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - ticketrush-net

  # ========== FRONTEND (React + Vite) ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketrush-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ticketrush-net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  kafka_data:
    driver: local

networks:
  ticketrush-net:
    driver: bridge
