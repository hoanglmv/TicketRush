apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketrush-backend
  namespace: ticketrush
  labels:
    app: ticketrush-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ticketrush-backend
  template:
    metadata:
      labels:
        app: ticketrush-backend
    spec:
      containers:
        - name: backend
          image: ticketrush-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: ticketrush-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/ticketrush?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticketrush-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ticketrush-config
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: ticketrush-config
                  key: REDIS_PORT
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: ticketrush-config
                  key: QDRANT_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: ticketrush-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: ticketrush-config
                  key: KAFKA_ENABLED
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ticketrush-secret
                  key: OPENROUTER_API_KEY
            - name: OPENROUTER_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ticketrush-config
                  key: OPENROUTER_MODEL
            - name: OPENROUTER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ticketrush-config
                  key: OPENROUTER_BASE_URL
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /api/events
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/events
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ticketrush-backend
  namespace: ticketrush
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: ticketrush-backend
