apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketrush-ingress
  namespace: ticketrush
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # WebSocket support for Real-time Seat Locking & Live Ticket Rush updates
    nginx.ingress.kubernetes.io/websocket-services: "ticketrush-backend"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  rules:
    - host: ticketrush.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ticketrush-backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: ticketrush-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketrush-frontend
                port:
                  number: 80
