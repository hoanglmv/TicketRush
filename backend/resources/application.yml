server:
  port: 8080

spring:
  application:
    name: TicketRush

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: jdbc:mysql://localhost:3307/ticketrush?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6380
      password:
      timeout: 5000

  jackson:
    default-property-inclusion: non_null

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ticketrush-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"

# JWT Configuration
app:
  jwt:
    secret: TicketRushSuperSecretKeyForJWTTokenGeneration2026MustBeAtLeast256Bits
    expiration-ms: 86400000       # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  # Seat lock timeout in minutes
  seat-lock-timeout-minutes: 10

  # Virtual queue default batch size
  queue-default-batch-size: 50

  # CORS
  cors:
    allowed-origins: http://localhost:5173

  # LLM API Configuration for AI Agents
  llm:
    provider: ${LLM_PROVIDER:openrouter}
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      model: ${OPENROUTER_MODEL:google/gemini-2.0-flash-exp:free}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama3-8b-8192}

  # RAG & Vector Database Configuration
  rag:
    enabled: true
    qdrant-url: ${QDRANT_URL:http://localhost:6333}
    collection-name: ticketrush_knowledge
    embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}

  # Kafka Event Streaming Configuration
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topics:
      booking: ticket-booking-events
      payment: ticket-payment-events
      notification: ticket-notification-events
      telemetry: agent-telemetry-events
